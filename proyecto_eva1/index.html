<!-- PAGINA PRINCIPAL  DE LA TIENDA: dONDE SE VE EL CATALOGO -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-secondary">

  <nav class="navbar bg-white border-bottom">
    <div class="container">
      <span class="navbar-brand mb-0 h1"> 🧸ToyWorld</span>
      <div class="d-flex align-items-center gap-3">
        <span class="small text-secondary" id="navUsuario"></span>
        <button class="btn btn-outline-secondary btn-sm" id="btnSalir">Cerrar sesión</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">

    <h1 class="h3">Hola, <span id="nombreUsuario"></span></h1>
    <p class="text-secondary">
      Estás dentro como <span class="badge text-bg-secondary" id="badgeRol"></span>
    </p>

    <div class="row g-3 mt-2">

      <div class="col-md-4">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="h5 card-title">Productos</h2>
            <p class="card-text small text-secondary" id="descProductos"></p>
            <a href="productos.html" class="btn btn-primary btn-sm">Ir a productos</a>
       
        </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="h5 card-title">Productos activos</h2>
            <p class="display-6 mb-0" id="totalActivos">—</p>
            <p class="card-text small text-secondary">de <span id="totalProductos">—</span> registrados</p>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="h5 card-title">Sin stock</h2>
            <p class="display-6 mb-0" id="totalSinStock">—</p>
            <p class="card-text small text-secondary">productos en cero</p>
          </div>
        </div>
      </div>

    </div>
  </main>

<script>
/* ============ SEED DE PRODUCTOS ============ */
/* Mismo seed que productos.html: la primera página que se abra siembra localStorage */
const SEED_PRODUCTOS = [
  { id:1, codigo:"NB-001", nombre:"Notebook Lenovo ThinkPad E14",   categoria:"Computación",    precio:749990, stock:12, activo:true  },
  { id:2, codigo:"MN-002", nombre:'Monitor Samsung 27" 144Hz',      categoria:"Computación",    precio:189990, stock:30, activo:true  },
  { id:3, codigo:"TC-003", nombre:"Teclado mecánico Redragon K552", categoria:"Periféricos",    precio:39990,  stock:45, activo:true  },
  { id:4, codigo:"MS-004", nombre:"Mouse Logitech M170",            categoria:"Periféricos",    precio:12990,  stock:80, activo:true  },
  { id:5, codigo:"RT-005", nombre:"Router TP-Link Archer AX10",     categoria:"Redes",          precio:54990,  stock:18, activo:true  },
  { id:6, codigo:"SW-006", nombre:"Switch TP-Link 8 puertos",       categoria:"Redes",          precio:29990,  stock:0,  activo:false },
  { id:7, codigo:"SD-007", nombre:"SSD Kingston NV2 1TB NVMe",      categoria:"Almacenamiento", precio:62990,  stock:25, activo:true  },
  { id:8, codigo:"HD-008", nombre:"Disco duro externo WD 2TB",      categoria:"Almacenamiento", precio:74990,  stock:9,  activo:true  }
];

const KEY_SESION    = "inv_sesion";
const KEY_PRODUCTOS = "inv_productos";

const sesion = Sesion();

if (!sesion) {
  window.location.replace("login.html");
} else {
  /* textContent y no innerHTML: si el nombre trae etiquetas, se ven como texto */
  document.getElementById("nombreUsuario").textContent = sesion.nombre;
  document.getElementById("navUsuario").textContent    = sesion.usuario;
  document.getElementById("badgeRol").textContent      = sesion.rol === "admin" ? "Administrador" : "Usuario";
  document.getElementById("descProductos").textContent = sesion.rol === "admin"
    ? "Crea, edita y elimina productos del catálogo."
    : "Consulta el catálogo de productos disponibles.";

  const productos = cargarProductos();
  document.getElementById("totalProductos").textContent = productos.length;
  document.getElementById("totalActivos").textContent   = productos.filter(p => p.activo).length;
  document.getElementById("totalSinStock").textContent  = productos.filter(p => p.stock === 0).length;
}

document.getElementById("btnSalir").addEventListener("click", function () {
  sessionStorage.removeItem(KEY_SESION);
  window.location.replace("login.html");
});

function leerSesion() {
  try {
    const s = JSON.parse(sessionStorage.getItem(KEY_SESION));
    if (!s || !s.usuario || !s.rol) return null;
    if (s.expira && Date.now() > s.expira) {
      sessionStorage.removeItem(KEY_SESION);
      return null;
    }
    return s;
  } catch (e) {
    return null;
  }
}

function cargarProductos() {
  const guardados = localStorage.getItem(KEY_PRODUCTOS);
  if (guardados) {
    try { return JSON.parse(guardados); } catch (e) { /* cae al seed */ }
  }
  localStorage.setItem(KEY_PRODUCTOS, JSON.stringify(SEED_PRODUCTOS));
  return SEED_PRODUCTOS;
}
</script>

</body>
</html
