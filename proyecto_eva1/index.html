<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToyWorld - Panel Principal</title>


  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR  ,navegadorr -->
  <nav class="navbar navbar-toyworld py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <span class="brand-title mb-0">🧸 ToyWorld</span>
      <div class="d-flex align-items-center gap-3">
        <span class="small fw-medium text-secondary" id="navUsuario">@usuario</span>
        <button class="btn btn-outline-danger btn-sm rounded-pill px-3" id="btnSalir">
          <i class="fa-solid fa-right-from-bracket me-1"></i> Cerrar sesión
        </button>
      </div>
    </div>
  </nav>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="container py-4">

    <h1 class="h3 fw-bold text-dark">Hola, <span id="nombreUsuario" class="text-primary"></span></h1>
    <p class="text-secondary">
      Estás dentro como <span class="badge" id="badgeRol"></span>
    </p>

    <div class="row g-4 mt-1">

      <!-- TARJETA 1: ACCESO -->
      <div class="col-md-4">
        <div class="card card-dashboard h-100">
          <div class="card-body d-flex flex-column p-4">
            <h2 class="h5 card-title fw-bold text-dark mb-2">
              <i class="fa-solid fa-boxes-stacked me-2 text-danger"></i>Productos
            </h2>
            <p class="card-text small text-secondary flex-grow-1" id="descProductos">
              Accede a la sección de catálogo para ver y agregar artículos.
            </p>
            <a href="productos.html" id="btnAccesoSeccion" class="btn btn-toyworld btn-sm w-100 py-2 mt-3">
              Ir a Productos
            </a>
          </div>
        </div>
      </div>

  
      <div class="col-md-4">
        <div class="card card-dashboard h-100">
          <div class="card-body p-4">
            <h2 class="h5 card-title fw-bold text-dark mb-2">
              <i class="fa-solid fa-circle-check me-2 text-success"></i>Productos activos
            </h2>
            <p class="display-5 mb-0 fw-bold text-success" id="totalActivos">0</p>
            <p class="card-text small text-secondary">de <span id="totalProductos" class="fw-bold">0</span> registrados</p>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card card-dashboard h-100">
          <div class="card-body p-4">
            <h2 class="h5 card-title fw-bold text-dark mb-2">
              <i class="fa-solid fa-triangle-exclamation me-2 text-danger"></i>Sin stock
            </h2>
            <p class="display-5 mb-0 fw-bold text-danger" id="totalSinStock">0</p>
            <p class="card-text small text-secondary">productos en cero</p>
          </div>
        </div>
      </div>

    </div>
  </main>

 
  <script>
  
  /* ============ SEED DE PRODUCTOS (TOYWORLD) ============ */
/* Mismo seed que productos.html: la primera página que se abra siembra localStorage */
const SEED_PRODUCTOS = [
  { id: 1, codigo: "JW-001", nombre: "Oso de Peluche Gigante 1m", categoria: "Peluches",     precio: 19990, stock: 12, activo: true  },
  { id: 2, codigo: "JW-002", nombre: "Auto Ferrari Control Remoto",categoria: "Vehículos",    precio: 24990, stock: 30, activo: true  },
  { id: 3, codigo: "JW-003", nombre: "Set Lego Star Wars X-Wing",   categoria: "Construcción", precio: 45990, stock: 15, activo: true  },
  { id: 4, codigo: "JW-004", nombre: "Muñeca Articulada Barbie",    categoria: "Muñecas",     precio: 12990, stock: 45, activo: true  },
  { id: 5, codigo: "JW-005", nombre: "Juego de Mesa Monopoly",      categoria: "Juegos Mesa",  precio: 18990, stock: 8,  activo: true  },
  { id: 6, codigo: "JW-006", nombre: "Pistola de Agua Nerf Super",  categoria: "Aire Libre",   precio: 15990, stock: 0,  activo: false },
  { id: 7, codigo: "JW-007", nombre: "Pista de Autos Hot Wheels",   categoria: "Vehículos",    precio: 29990, stock: 20, activo: true  },
  { id: 8, codigo: "JW-008", nombre: "Rompecabezas 1000 Piezas",    categoria: "Juegos Mesa",  precio: 9990,  stock: 0,  activo: true  }
];

const KEY_SESION    = "inv_sesion";
const KEY_PRODUCTOS = "inv_productos";

// Se llama a leerSesion() para validar el acceso
const sesion = leerSesion();

if (!sesion) {
  window.location.replace("login.html");
} else {

  document.getElementById("nombreUsuario").textContent = sesion.nombre;
  document.getElementById("navUsuario").textContent    = sesion.usuario;
  document.getElementById("badgeRol").textContent      = sesion.rol === "admin" ? "Administrador" : "Usuario";
  document.getElementById("descProductos").textContent = sesion.rol === "admin"
    ? "Crea, edita y elimina juguetes del catálogo."
    : "Consulta el catálogo de juguetes disponibles.";

  const productos = cargarProductos();
  document.getElementById("totalProductos").textContent = productos.length;
  document.getElementById("totalActivos").textContent   = productos.filter(p => p.activo).length;
  document.getElementById("totalSinStock").textContent  = productos.filter(p => p.stock === 0).length;
}

document.getElementById("btnSalir").addEventListener("click", function () {
  sessionStorage.removeItem(KEY_SESION);
  window.location.replace("login.html");
});

function leerSesion() {
  try {
    const s = JSON.parse(sessionStorage.getItem(KEY_SESION));
    if (!s || !s.usuario || !s.rol) return null;
    if (s.expira && Date.now() > s.expira) {
      sessionStorage.removeItem(KEY_SESION);
      return null;
    }
    return s;
  } catch (e) {
    return null;
  }
}

function cargarProductos() {
  const guardados = localStorage.getItem(KEY_PRODUCTOS);
  if (guardados) {
    try { return JSON.parse(guardados); } catch (e) { /* cae al seed */ }
  }
  localStorage.setItem(KEY_PRODUCTOS, JSON.stringify(SEED_PRODUCTOS));
  return SEED_PRODUCTOS;
}
  
  
  
  
  </script>
</body>
</html>
