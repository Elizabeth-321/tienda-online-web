<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToyWorld - Iniciar sesión</title>
</head>
<body class="login-body">

  <main class="wrapper">
    <div class="form-wrapper sign in">
      <form id="formLogin" novalidate>
        <h1 class="h4 mb-1">🧸 Login </h1>
        <p class="text-secondary small mb-4">Ingresa con tu usuario para continuar.</p>
        <div id="alerta" class="alert alert-danger d-none" role="alert"></div>

        <div class="mb-3">
          <label for="usuario" class="form-label">Usuario</label>
          <input type="text" class="form-control" id="usuario" maxlength="30" autocomplete="username" autofocus>
          <div class="invalid-feedback" id="errorUsuario"></div>
        </div>

        <div class="mb-3">
          <label for="clave" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="clave" maxlength="64" autocomplete="current-password">
          <div class="invalid-feedback" id="errorClave"></div>
        </div>

        <button type="button" class="btn btn-toyworld w-100" id="btnEntrar">Entrar</button>

        <hr class="my-4">
        <p class="small text-secondary mb-0">
          Cuentas de prueba:<br>
          <code>admin / Admi123</code> — administrador<br>
          <code>eli / eli123</code> — usuario
        </p>
      </form>
    </div>
  </main>

  <footer class="login-footer text-center small text-white-50 py-3">
    &copy; 2026 ToyWorld —  Desarrollo Fullstack II.
  </footer>

  <script src="common.js"></script>
  <script>

  const SEED_USUARIOS = [
    { id: 1, usuario: "admin",   nombre: "Israel Muñoz",    email: "admin@example.com",    clave: "Admi123", rol: "admin", activo: true  },
    { id: 2, usuario: "alagos",  nombre: "Alejandra Lagos",  email: "alagos@example.com",   clave: "user123", rol: "user",  activo: true  },
    { id: 3, usuario: "eli",     nombre: "Elizabeth Lagos",  email: "el.lagos@example.com", clave: "eli123",  rol: "user",  activo: true  },
    { id: 4, usuario: "afuente", nombre: "Alfonso Fuentes",  email: "alfus@example.com",    clave: "alfo24",  rol: "user",  activo: false }
  ];

  // Reglas de negocio para el login
  const MAX_INTENTOS = 3;
  const BLOQUEO_MS   = 60000;

  const alerta        = document.getElementById("alerta");
  const btnEntrar      = document.getElementById("btnEntrar");
  const inputUsuario   = document.getElementById("usuario");
  const inputClave     = document.getElementById("clave");
  const errorUsuario   = document.getElementById("errorUsuario");
  const errorClave     = document.getElementById("errorClave");

  // Si ya hay una sesión activa guardada, redirige directamente a index.html
  (function verificarSesionExistente() {
    try {
      const s = JSON.parse(sessionStorage.getItem(KEY_SESION));
      if (s && s.usuario && (!s.expira || Date.now() < s.expira)) {
        window.location.replace("index.html");
      }
    } catch (e) {
      sessionStorage.removeItem(KEY_SESION);
    }
  })();

  /* ---------- Validación de campos ---------- */
  function validarCampos() {
    let valido = true;
    limpiarValidacion();

    if (!inputUsuario.value.trim()) {
      marcarInvalido(inputUsuario, errorUsuario, "Ingresa tu nombre de usuario.");
      valido = false;
    }
    if (!inputClave.value.trim()) {
      marcarInvalido(inputClave, errorClave, "Ingresa tu contraseña.");
      valido = false;
    } else if (inputClave.value.trim().length < 4) {
      marcarInvalido(inputClave, errorClave, "La contraseña debe tener al menos 4 caracteres.");
      valido = false;
    }
    return valido;
  }

  function marcarInvalido(input, elError, mensaje) {
    input.classList.add("is-invalid");
    elError.textContent = mensaje;
  }

  function limpiarValidacion() {
    [inputUsuario, inputClave].forEach(i => i.classList.remove("is-invalid"));
    errorUsuario.textContent = "";
    errorClave.textContent = "";
  }

  /* ---------- Lógica de autenticación ---------- */
  function entrar() {
    ocultarError();
    if (!validarCampos()) return;

    const espera = bloqueoRestante();
    if (espera > 0) {
      mostrarError("Demasiados intentos fallidos. Intenta de nuevo en " + espera + " segundos.");
      return;
    }

    const usuario = inputUsuario.value.trim();
    const clave   = inputClave.value.trim();

    const encontrado = SEED_USUARIOS.find(function (u) {
      return u.usuario.toLowerCase() === usuario.toLowerCase() && u.clave === clave;
    });

    if (!encontrado) {
      registrarFallo();
      mostrarError("Usuario o contraseña incorrectos.");
      inputClave.value = "";
      return;
    }

    if (!encontrado.activo) {
      mostrarError("Tu cuenta está desactivada. Contacta al administrador.");
      return;
    }

    localStorage.removeItem(KEY_INTENTOS);

    // Guarda la sesión activa en sessionStorage
    sessionStorage.setItem(KEY_SESION, JSON.stringify({
      id:      encontrado.id,
      usuario: encontrado.usuario,
      nombre:  encontrado.nombre,
      rol:     encontrado.rol,
      expira:  Date.now() + 30 * 60 * 1000 // Expira en 30 minutos
    }));

    window.location.href = "index.html";
  }

  function mostrarError(msg) {
    alerta.textContent = msg;
    alerta.classList.remove("d-none");
  }

  function ocultarError() {
    alerta.classList.add("d-none");
    alerta.textContent = "";
  }

  function bloqueoRestante() {
    const d = JSON.parse(localStorage.getItem(KEY_INTENTOS) || '{"n":0,"hasta":0}');
    return d.hasta > Date.now() ? Math.ceil((d.hasta - Date.now()) / 1000) : 0;
  }

  function registrarFallo() {
    const d = JSON.parse(localStorage.getItem(KEY_INTENTOS) || '{"n":0,"hasta":0}');
    d.n++;
    if (d.n >= MAX_INTENTOS) { d.hasta = Date.now() + BLOQUEO_MS; d.n = 0; }
    localStorage.setItem(KEY_INTENTOS, JSON.stringify(d));
  }

  // Eventos
  btnEntrar.addEventListener("click", entrar);
  inputUsuario.addEventListener("keydown", e => { if (e.key === "Enter") inputClave.focus(); });
  inputClave.addEventListener("keydown", e => { if (e.key === "Enter") entrar(); });
  inputUsuario.addEventListener("input", () => inputUsuario.classList.remove("is-invalid"));
  inputClave.addEventListener("input", () => inputClave.classList.remove("is-invalid"));

  </script>
</body>
</html>
